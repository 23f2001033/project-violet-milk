# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file, builds the Dockerfile, and prompts for the secrets
# marked `sync: false`.
#
# FREE PLAN, KNOWN AND ACCEPTED:
#   * the instance sleeps after ~15 minutes idle and takes roughly 50 seconds
#     to wake, so warm it before sending anyone the link;
#   * there is no persistent disk, so violet.db, generated PDFs and any anchor
#     receipts reset on every deploy or restart. The demo case re-seeds itself
#     at import, so the app is always usable - but the custody log is NOT a
#     durable record on this plan. Add a paid disk before that matters.

services:
  - type: web
    name: violet-milk
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Closest Render region to India.
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Replays pre-tested addresses from the committed cache instead of
      # calling Etherscan. On a public instance this is what stops a stranger
      # burning the API quota, and it makes traces answer instantly.
      - key: LIVE_CACHE_FIRST
        value: "true"

      # Signs session tokens. Generated by Render, never committed.
      - key: AUTH_SECRET
        generateValue: true

      # MUST be set to something other than the documented demo password.
      # The repository publishes the default, so a public instance left on it
      # is open to anyone who has read the README.
      - key: DEMO_OFFICER_PASSWORD
        sync: false

      # Optional. Without them the app still runs: live mode falls back to the
      # cache, and the narrative falls back to the deterministic template.
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false

      # Deliberately absent: ANCHOR_PRIVATE_KEY. Anchoring stays a local-only
      # capability - a signing key does not belong on a free public host.
